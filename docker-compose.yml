services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: deskforge
      POSTGRES_USER: deskforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deskforge}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deskforge -d deskforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/deskforge
      DATABASE_USERNAME: deskforge
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-deskforge}
      JWT_SECRET: ${JWT_SECRET:-ZGVza2ZvcmdlLWxvY2FsLWRldmVsb3BtZW50LXNlY3JldC1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbg==}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
