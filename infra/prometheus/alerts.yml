groups:
  - name: deskforge
    rules:
      - alert: ApiDown
        expr: up{job="deskforge-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: A API do DeskForge não responde há 2 minutos

      - alert: HighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{outcome="SERVER_ERROR"}[5m]))
            / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Mais de 5% das requisições estão falhando com erro 5xx

      - alert: SlowRequests
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{uri!~"/actuator.*"}[5m]))) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: O p95 de latência passou de 1 segundo

      - alert: EmailQueueStuck
        expr: deskforge_emails_pending > 20
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Há mais de 20 e-mails parados na fila há 15 minutos. Verifique o SMTP.

      - alert: EmailDeliveryGaveUp
        expr: increase(deskforge_emails_failures_total{final="true"}[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: Um e-mail esgotou as tentativas de envio e está marcado como FAILED

      - alert: RefreshTokenReuse
        expr: increase(deskforge_auth_refresh_reuse_total[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: Um refresh token já usado foi apresentado de novo (possível roubo de sessão)

      - alert: LoginBruteForce
        expr: increase(deskforge_auth_logins_total{outcome="blocked"}[10m]) > 20
        labels:
          severity: warning
        annotations:
          summary: Muitos logins bloqueados pelo limite de tentativas nos últimos 10 minutos
