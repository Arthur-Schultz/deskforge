spring:
  application:
    name: deskforge-api
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/deskforge}
    username: ${DATABASE_USERNAME:deskforge_app}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    user: ${DATABASE_MIGRATION_USERNAME:${POSTGRES_USER:deskforge}}
    password: ${DATABASE_MIGRATION_PASSWORD:${POSTGRES_PASSWORD:}}
  mvc:
    problemdetails:
      enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-null-for-primitives: false

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

deskforge:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    jwt:
      secret: ${JWT_SECRET:}
      expiration: PT8H
      issuer: deskforge-api
    password-reset:
      validity: PT30M
      request-cooldown: PT1M
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  payment:
    provider: ${PAYMENT_PROVIDER:simulated}
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  mail:
    from: ${MAIL_FROM:DeskForge <nao-responda@deskforge.dev>}
    batch-size: 20
    dispatch-interval: PT5S
    zone: America/Sao_Paulo
  jobs:
    enabled: true
    order-expiration-interval: PT1M
  audit:
    access-log-retention: P6M
    retention-cron: "0 30 3 * * *"
  store:
    trade-name: DeskForge
    legal-name: DeskForge Comércio de Periféricos Ltda. (empresa fictícia)
    cnpj: 00.000.000/0000-00
    address: Av. Demonstração, 2026, Sala 404, Centro, Cidade Exemplo/SP, 00000-000
    support-email: sac@deskforge.dev
    support-phone: (00) 0000-0000
    support-hours: Segunda a sexta, das 9h às 18h
    data-protection-officer: Encarregado de Dados (fictício)
    data-protection-email: privacidade@deskforge.dev
    privacy-policy-version: "2026-11"
    withdrawal-days: 7
    support-response-days: 5
    data-subject-response-days: 15
    payment-window-minutes: 30
    free-shipping-threshold: 299.00
    flat-shipping-cost: 24.90
    approximate-tax-rate: 0.2785
    demo-mode: true
