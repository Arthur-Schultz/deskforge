<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{html/layout :: email(preheader='Use o link para criar uma nova senha.', content=~{::content})}">
<body>
<th:block th:fragment="content">
    <h1 style="margin:0 0 16px;font-size:24px;line-height:1.25;">Redefinir senha</h1>
    <p style="margin:0 0 12px;">Oi, <span th:text="${firstName}">Cliente</span>.</p>
    <p style="margin:0 0 12px;">Recebemos um pedido para redefinir a senha da sua conta. O link vale por <span th:text="${validityMinutes}">30</span> minutos e só pode ser usado uma vez.</p>
    <th:block th:replace="~{html/components :: button(label='Criar nova senha', href=${resetUrl})}"/>
    <p style="margin:0 0 12px;font-size:14px;color:#596070;">Se o botão não funcionar, copie e cole este endereço no navegador:<br><a th:href="${resetUrl}" th:text="${resetUrl}" style="color:#2747e0;word-break:break-all;">link</a></p>
    <p style="margin:0;font-size:14px;color:#596070;">Não foi você? Pode ignorar este e-mail: sua senha continua a mesma.</p>
</th:block>
</body>
</html>
